---
- name: Установить пакеты кластера
  community.general.apt_rpm:
    package: "{{ ha_nfs_cluster_packages }}"
    state: present

- name: Остановить службы до настройки кластера
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - pacemaker
    - corosync
    - sbd
    - drbd
    - nfs-server
