---
- name: Загрузить softdog
  community.general.modprobe:
    name: softdog
    state: present
    persistent: present

- name: Проверить устройство watchdog
  ansible.builtin.stat:
    path: /dev/watchdog
  register: watchdog_device

- name: Убедиться в наличии watchdog
  ansible.builtin.assert:
    that:
      - watchdog_device.stat.exists | default(false)
      - watchdog_device.stat.ischr | default(false)
    fail_msg: Устройство /dev/watchdog не найдено.
