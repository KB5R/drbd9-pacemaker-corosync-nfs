---
# rpcbind работает как обычная системная служба на двух storage-узлах.
- name: Запустить rpcbind
  ansible.builtin.systemd_service:
    name: rpcbind
    enabled: true
    state: started
  when: inventory_hostname in groups['drbd_nodes']

# NFS нельзя запускать автоматически через systemd: им управляет только Pacemaker.
- name: Отключить системный автозапуск NFS
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: false
  when: inventory_hostname in groups['drbd_nodes']

# Обёртка возвращает корректный код состояния для OCF-агента nfsserver в ALT Linux.
- name: Установить обёртку управления NFS
  ansible.builtin.copy:
    src: ha-nfs-server
    dest: /usr/local/sbin/ha-nfs-server
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['drbd_nodes']

- name: Проверить ресурс служебной файловой системы
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - p_fs_nfs_state
  register: nfs_state_resource
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: node1

- name: Проверить ресурс файловой системы данных
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - p_fs_nfs_data
  register: nfs_data_resource
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: node1

- name: Проверить ресурс NFS server
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - p_nfsserver
  register: nfs_server_resource
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: node1

- name: Проверить ресурс NFS export
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - p_exportfs
  register: nfs_export_resource
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: node1

- name: Проверить ресурс VIP
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - p_nfs_vip
  register: nfs_vip_resource
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: node1

- name: Получить ограничения NFS
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - config
      - --full
  register: nfs_constraints
  changed_when: false
  run_once: true
  delegate_to: node1

- name: Получить свойства Pacemaker для NFS
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - config
      - --all
  register: nfs_pacemaker_properties
  changed_when: false
  run_once: true
  delegate_to: node1

- name: Определить необходимость изменения NFS-ресурсов
  ansible.builtin.set_fact:
    nfs_resources_need_changes: >-
      {{ nfs_state_resource.rc != 0 or
         nfs_data_resource.rc != 0 or
         nfs_server_resource.rc != 0 or
         nfs_export_resource.rc != 0 or
         nfs_vip_resource.rc != 0 or
         'colocation-g_nfs-p_drbd_nfs-clone' not in nfs_constraints.stdout or
         'order-p_drbd_nfs-clone-g_nfs' not in nfs_constraints.stdout }}
  run_once: true

# Ресурсы создаются в maintenance mode и не запускаются до добавления ограничений.
- name: Включить режим обслуживания для настройки NFS
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - set
      - maintenance-mode=true
  changed_when: true
  when: nfs_resources_need_changes
  run_once: true
  delegate_to: node1

# Служебный том запускается первым и хранит общее состояние NFS.
- name: Создать ресурс служебной файловой системы
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - p_fs_nfs_state
      - ocf:heartbeat:Filesystem
      - device=/dev/drbd/by-res/ha_nfs/0
      - directory=/srv/ha-nfs/state
      - "fstype={{ ha_nfs_filesystem }}"
      - run_fsck=no
      - op
      - monitor
      - interval=20s
      - timeout=40s
      - --group
      - g_nfs
  changed_when: true
  when: nfs_state_resource.rc != 0
  run_once: true
  delegate_to: node1

- name: Создать ресурс файловой системы данных
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - p_fs_nfs_data
      - ocf:heartbeat:Filesystem
      - device=/dev/drbd/by-res/ha_nfs/1
      - directory=/srv/ha-nfs/data
      - "fstype={{ ha_nfs_filesystem }}"
      - run_fsck=no
      - op
      - monitor
      - interval=20s
      - timeout=40s
      - --group
      - g_nfs
  changed_when: true
  when: nfs_data_resource.rc != 0
  run_once: true
  delegate_to: node1

# Pacemaker запускает NFS только после монтирования обоих XFS-томов.
- name: Создать ресурс NFS server
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - p_nfsserver
      - ocf:heartbeat:nfsserver
      - nfs_shared_infodir=/srv/ha-nfs/state/nfs_info
      - "nfs_ip={{ ha_nfs_vip }}"
      - nfs_init_script=/usr/local/sbin/ha-nfs-server
      - op
      - monitor
      - interval=15s
      - timeout=30s
      - --group
      - g_nfs
  changed_when: true
  when: nfs_server_resource.rc != 0
  run_once: true
  delegate_to: node1

# fsid=0 делает каталог корнем NFSv4, доступным клиенту как server:/.
- name: Создать ресурс NFS export
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - p_exportfs
      - ocf:heartbeat:exportfs
      - "clientspec={{ ha_nfs_clients }}"
      - directory=/srv/ha-nfs/data
      - fsid=0
      - options=rw,sync,root_squash
      - unlock_on_stop=1
      - op
      - monitor
      - interval=15s
      - timeout=30s
      - --group
      - g_nfs
  changed_when: true
  when: nfs_export_resource.rc != 0
  run_once: true
  delegate_to: node1

# VIP создаётся последним, поэтому клиенты увидят адрес только после готовности NFS.
- name: Создать ресурс VIP
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - p_nfs_vip
      - ocf:heartbeat:IPaddr2
      - "ip={{ ha_nfs_vip }}"
      - cidr_netmask=24
      - op
      - monitor
      - interval=10s
      - timeout=20s
      - --group
      - g_nfs
  changed_when: true
  when: nfs_vip_resource.rc != 0
  run_once: true
  delegate_to: node1

# Вся группа NFS должна работать на том же узле, где DRBD находится в Primary.
- name: Разместить NFS вместе с DRBD Primary
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - colocation
      - add
      - g_nfs
      - with
      - Promoted
      - p_drbd_nfs-clone
      - INFINITY
      - id=colocation-g_nfs-p_drbd_nfs-clone
  changed_when: true
  when: "'colocation-g_nfs-p_drbd_nfs-clone' not in nfs_constraints.stdout"
  run_once: true
  delegate_to: node1

# Сначала Pacemaker повышает DRBD, затем запускает файловые системы и NFS.
- name: Запускать NFS после повышения DRBD
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - order
      - promote
      - p_drbd_nfs-clone
      - then
      - start
      - g_nfs
      - id=order-p_drbd_nfs-clone-g_nfs
  changed_when: true
  when: "'order-p_drbd_nfs-clone-g_nfs' not in nfs_constraints.stdout"
  run_once: true
  delegate_to: node1

- name: Проверить итоговую конфигурацию Pacemaker
  ansible.builtin.command:
    argv:
      - crm_verify
      - -L
      - -V
  changed_when: false
  run_once: true
  delegate_to: node1

- name: Выключить режим обслуживания после настройки NFS
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - set
      - maintenance-mode=false
  changed_when: true
  when: >-
    nfs_resources_need_changes or
    nfs_pacemaker_properties.stdout is regex('maintenance-mode[=:]\s*true')
  run_once: true
  delegate_to: node1

- name: Дождаться запуска группы NFS
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - status
      - g_nfs
  register: nfs_group_status
  changed_when: false
  retries: 40
  delay: 5
  until:
    - nfs_group_status.rc == 0
    - nfs_group_status.stdout.count('Started') == 5
  run_once: true
  delegate_to: node1

- name: Настроить права общего NFS-хранилища
  ansible.builtin.file:
    path: /srv/ha-nfs/data
    state: directory
    mode: "{{ ha_nfs_data_mode }}"
  when: inventory_hostname in groups['drbd_nodes']
